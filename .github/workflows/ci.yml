name: kite-web-swift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test on macOS (Swift 6)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Swift Build
        run: swift build -v

      - name: Swift Test
        run: swift test -v

      - name: Test CLI Scaffolding
        run: |
          swift run kite-web-swift --version
          swift run kite-web-swift new SampleApp --template fullstack

  test-linux:
    name: Test on Linux (Ubuntu Swift 6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Swift 6.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Swift Build
        run: swift build -v

      - name: Swift Test
        run: swift test -v

      - name: Test CLI Scaffolding
        run: |
          swift run kite-web-swift --version
          swift run kite-web-swift new SampleAppLinux --template starter
