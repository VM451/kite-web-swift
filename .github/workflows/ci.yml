name: kite-web-swift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-macos:
    name: Test on macOS (Swift 6)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Swift Build
        run: swift build

      - name: Swift Test
        run: swift test

      - name: Test CLI Scaffolding
        run: |
          swift run kite-web-swift --version
          swift run kite-web-swift new SampleApp --template fullstack

  test-linux:
    name: Test on Linux (Ubuntu Swift 6)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Swift Build
        run: swift build

      - name: Swift Test
        run: swift test
