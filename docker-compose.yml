services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - KITE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://kite:secret@postgres:5432/kite_db
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kite
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kite_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
